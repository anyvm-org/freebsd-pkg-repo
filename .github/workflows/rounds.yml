name: Rounds

# Keeps the build going without a person watching it. Every time a Build
# run completes this looks at its merge job:
#   merge succeeded          -> dispatch the next round
#   merge failed, attempt<3  -> re-run just the merge job (build jobs are
#                               kept; their artifacts are what merge reads)
#   merge failed 3 times,    -> stop and say so
#   plan failed, or no slice
#   had work (tree finished)
# Set the repository variable AUTO_ROUNDS to "off" to pause the loop;
# ABI_SLUG, SLICES and DEADLINE variables override the defaults below.
#
# A workflow_dispatch sent with GITHUB_TOKEN does start a new run (that
# is the documented exception to "GITHUB_TOKEN events do not trigger
# workflows"), and a completed run fires workflow_run whoever started it,
# so the chain continues round after round.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  # Safety net: if the run that should have reacted to a finished round
  # itself failed (the API limit after round 9 did exactly that), look
  # at the latest Build run every two hours and act on it as if it had
  # just completed. Nothing happens while a run is still in progress.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run to evaluate (for testing the loop by hand)'
        required: true
      dry_run:
        description: 'Only print the decision, do not dispatch or re-run'
        required: false
        default: 'true'

permissions:
  actions: write
  contents: read

jobs:
  next:
    runs-on: ubuntu-latest
    # long enough to sit out an exhausted API hour (see the retries below)
    timeout-minutes: 80
    steps:
      - name: Decide what the finished round needs
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt || 1 }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'unknown' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          AUTO: ${{ vars.AUTO_ROUNDS }}
          ABI_SLUG: ${{ vars.ABI_SLUG }}
          SLICES: ${{ vars.SLICES }}
          DEADLINE: ${{ vars.DEADLINE }}
        run: |
          set -eu
          R='${{ github.repository }}'
          if [ "${AUTO:-on}" = "off" ]; then
            echo "AUTO_ROUNDS is off; not touching run $RUN_ID"
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            gh() { if [ "$1" = run ] && [ "$2" = view ]; then command gh "$@"; else echo "dry run: gh $*" >&2; fi; }
          fi
          if [ -z "$RUN_ID" ]; then
            # scheduled: take the latest Build run
            latest=$(gh run list --repo "$R" --workflow build.yml --limit 1                        --json databaseId,status,conclusion,attempt                        --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion // "") \(.attempt)"')
            set -- $latest
            RUN_ID="${1:-}"; status="${2:-}"; RUN_CONCLUSION="${3:-unknown}"; ATTEMPT="${4:-1}"
            echo "scheduled check: latest Build run $RUN_ID is $status ($RUN_CONCLUSION), attempt $ATTEMPT"
            if [ -z "$RUN_ID" ] || [ "$status" != "completed" ]; then
              echo "nothing to do"
              exit 0
            fi
          fi
          if [ "$RUN_CONCLUSION" = "cancelled" ]; then
            echo "run $RUN_ID was cancelled; stopping the loop here"
            exit 0
          fi
          # GITHUB_TOKEN has 1,000 API requests per hour per repository and
          # a merge that uploads a thousand assets can spend them all; the
          # first Rounds run after round 9 died on "API rate limit
          # exceeded". The limit resets on the hour: wait for it.
          n=0
          until gh run view "$RUN_ID" --repo "$R" --json jobs \
                  --jq '.jobs[] | "\(.name)\t\(.conclusion // "")\t\(.databaseId)"' > jobs.tsv; do
            n=$((n + 1))
            if [ "$n" -ge 7 ]; then echo "could not read run $RUN_ID after $n tries" >&2; exit 1; fi
            echo "gh run view failed (try $n); waiting 10 minutes for the API limit"
            sleep 600
          done
          cat jobs.tsv
          plan=$(awk -F'\t' '$1=="plan"{print $2}' jobs.tsv)
          merge=$(awk -F'\t' '$1=="merge"{print $2}' jobs.tsv)
          merge_id=$(awk -F'\t' '$1=="merge"{print $3}' jobs.tsv)
          builds=$(grep -c $'^build (' jobs.tsv || true)
          echo "plan=$plan merge=$merge builds=$builds attempt=$ATTEMPT"

          # A merge-only run (Build dispatched with merge_run set) has no
          # plan and no build jobs; its merge result alone decides.
          if [ "$plan" != "success" ] && [ "$plan" != "skipped" ] && [ -n "$plan" ]; then
            echo "plan did not succeed ($plan); a person has to look"
            exit 0
          fi
          if [ "$plan" = "success" ] && [ "$builds" -eq 0 ]; then
            echo "no slice had work: the tree is done for this ABI, or everything left is ignored/oversize"
            exit 0
          fi
          case "$merge" in
            success)
              echo "merge succeeded; dispatching the next round"
              n=0
              until gh workflow run build.yml --repo "$R" --ref main \
                      -f "abi_slug=${ABI_SLUG:-FreeBSD-15-riscv64}" \
                      -f pkglist=config/pkglist.all \
                      -f "slices=${SLICES:-18}" \
                      -f "deadline=${DEADLINE:-18000}"; do
                n=$((n + 1)); [ "$n" -ge 7 ] && exit 1
                echo "dispatch failed (try $n); waiting 10 minutes"; sleep 600
              done
              ;;
            failure)
              if [ "$ATTEMPT" -lt 3 ]; then
                echo "merge failed on attempt $ATTEMPT; re-running the merge job only"
                n=0
                until gh run rerun --job "$merge_id" --repo "$R"; do
                  n=$((n + 1)); [ "$n" -ge 7 ] && exit 1
                  echo "re-run request failed (try $n); waiting 10 minutes"; sleep 600
                done
              else
                echo "merge failed $ATTEMPT times; stopping, a person has to look"
              fi
              ;;
            *)
              echo "merge ended '$merge'; nothing to do"
              ;;
          esac
