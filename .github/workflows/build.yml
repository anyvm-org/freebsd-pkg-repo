name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      abi_slug:
        description: 'ABI slug from config/abis'
        required: false
        default: 'FreeBSD-15-riscv64'
      pkglist:
        description: 'Port list file to build'
        required: false
        default: 'config/pkglist'
      deadline:
        description: 'poudriere bulk wall-clock budget, seconds'
        required: false
        default: '16200'

# One build per ABI at a time. Every run regenerates the open shard's index
# and rewrites ledger.json from the ledger it fetched at ITS start, so two
# concurrent runs on the same ABI end with the last finisher's ledger
# overwriting the other's built set (assets survive, the record does not).
# Queue instead of cancelling: a queued run simply sees the newer ledger.
concurrency:
  group: build-${{ inputs.abi_slug }}
  cancel-in-progress: false

env:
  # Signer type for pkg repo: rsa, ecdsa or eddsa (pkg-repo(8) key
  # prefixes). Must match the key stored in the PKG_SIGNING_KEY secret.
  PKG_KEY_TYPE: ecdsa

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - name: Free up runner disk
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Read the ABI row
        id: abi
        run: |
          set -eu
          slug='${{ inputs.abi_slug }}'
          row=$(grep -v '^#' config/abis | awk -v s="$slug" '$1 == s {print; exit}')
          if [ -z "$row" ]; then
            echo "unknown abi slug: $slug" >&2
            exit 1
          fi
          echo "version=$(echo "$row" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "arch=$(echo "$row" | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "jail=$(echo "$row" | awk '{print $4}')" >> "$GITHUB_OUTPUT"
          major=$(echo "$row" | awk '{print $2}' | cut -d. -f1)
          echo "abi=FreeBSD:${major}:$(echo "$row" | awk '{print $3}' | cut -d. -f2)" >> "$GITHUB_OUTPUT"
          echo "resolved: $row"

      # The signing key comes from a secret and is written into work/, which
      # the VM sees over NFS. The private key never leaves this job; the VM
      # is discarded when the job ends.
      #
      # The secret holds the key BASE64-ENCODED. pkg's ecdsa and eddsa
      # signers (pkgsign_ecc.c, libecc) accept only keys made by
      # "pkg key --create", which are binary -- 148 bytes for ecdsa -- and a
      # GitHub secret is text. OpenSSL-made EC keys are rejected outright:
      # pkgsign_ossl.c checks EVP_PKEY_id(pkey) != EVP_PKEY_RSA and bails
      # (measured 2026-09-02: "failed to decode private key" for both SEC1
      # and PKCS#8). Nothing here can inspect the key; pkg repo in the VM
      # is the check, and it fails loudly on a bad one.
      - name: Materialise the signing key
        env:
          PKG_SIGNING_KEY_B64: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          set -eu
          mkdir -p work
          if [ -z "$PKG_SIGNING_KEY_B64" ]; then
            echo "PKG_SIGNING_KEY secret is not set. On a FreeBSD box:" >&2
            echo "  pkg key --create -t ${PKG_KEY_TYPE} repo.key" >&2
            echo "  openssl base64 -A -in repo.key | gh secret set PKG_SIGNING_KEY --repo ${{ github.repository }}" >&2
            exit 1
          fi
          printf '%s' "$PKG_SIGNING_KEY_B64" | base64 -d > work/repo.key
          chmod 600 work/repo.key
          test -s work/repo.key
          echo "key: $(wc -c < work/repo.key) bytes, type ${PKG_KEY_TYPE}"

      - name: Fetch the published ledger and the open shard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          PYTHONPATH=scripts python3 scripts/publish.py \
            --repo "${{ github.repository }}" \
            --abi-slug "${{ inputs.abi_slug }}" \
            --workdir work \
            prepare --existing work/existing
          # poudriere's package directory lives HERE on the runner (the VM
          # symlinks its data/packages onto this NFS-mounted path). Seed
          # it with everything already published, under the original file
          # names and in poudriere's committed layout (.latest/All), so
          # poudriere unqueues those instead of rebuilding them.
          PYTHONPATH=scripts python3 scripts/seed.py \
            --ledger   work/ledger.json \
            --existing work/existing \
            --dest     "work/pkgdata/packages/${{ steps.abi.outputs.jail }}-default"
          chmod -R a+rwX work/pkgdata

      - name: Build the slice and stage the shards in a FreeBSD VM
        id: vm
        uses: vmactions/freebsd-vm@v1
        env:
          ABI_SLUG: ${{ inputs.abi_slug }}
          TARGET_ABI: ${{ steps.abi.outputs.abi }}
          FBSD_VERSION: ${{ steps.abi.outputs.version }}
          POUDRIERE_ARCH: ${{ steps.abi.outputs.arch }}
          # Not "JAIL": pkg treats a JAIL environment variable as "run my
          # scripts inside that jail" and the host's own pkg install then
          # fails every POST-INSTALL with 'jexec: jail "..." not found'.
          # Same class of bug as ABI -> TARGET_ABI.
          POUDRIERE_JAIL: ${{ steps.abi.outputs.jail }}
          PKGLIST: ${{ inputs.pkglist }}
          BUILD_DEADLINE: ${{ inputs.deadline }}
          REPO: ${{ github.repository }}
          PKG_KEY_TYPE: ${{ env.PKG_KEY_TYPE }}
          # Same absolute path inside the VM: freebsd-vm mounts the
          # workspace at its runner path.
          PKGDATA: ${{ github.workspace }}/work/pkgdata
        with:
          # Major-version prefix: freebsd-vm resolves it to the newest
          # matching release ("Only the leading, '.' separated part of it is
          # enough" -- action.yml). This is the amd64 BUILD host only; the
          # riscv64 target version is pinned in config/abis, because
          # poudriere needs a concrete base.txz URL.
          release: '15'
          mem: 12288
          cpu: 4
          # NFS: the workspace is mounted live, so out/ written in the VM is
          # visible on the runner immediately, and work/ written on the
          # runner (key, ledger, open-shard packages) is visible in the VM.
          sync: nfs
          copyback: true
          # The prepared image (poudriere, emulator, jail, ports tree) is
          # cached after 'prepare' and restored on later runs, which then
          # skip 'prepare' entirely. freebsd-vm keys that cache on
          # sha256(prepare text + sync), NOT on the environment, so the ABI
          # values below are spelled out literally: with them only in envs,
          # every ABI would share one prepared image.
          cache-after-prepare: true
          envs: 'ABI_SLUG TARGET_ABI FBSD_VERSION POUDRIERE_ARCH POUDRIERE_JAIL PKGLIST BUILD_DEADLINE REPO PKG_KEY_TYPE PKGDATA'
          prepare: |
            # cache key material -- abi=${{ inputs.abi_slug }} version=${{ steps.abi.outputs.version }} arch=${{ steps.abi.outputs.arch }} jail=${{ steps.abi.outputs.jail }}
            # prepare-epoch: 1  (bump to force a fresh jail and ports tree)
            set -eu
            mkdir -p /root/prep
            tar -cf - scripts | tar -xf - -C /root/prep
            export FBSD_VERSION='${{ steps.abi.outputs.version }}'
            export POUDRIERE_ARCH='${{ steps.abi.outputs.arch }}'
            export POUDRIERE_JAIL='${{ steps.abi.outputs.jail }}'
            sh /root/prep/scripts/vm_prepare.sh
          run: |
            set -eu
            # Run from a private copy, never off the live NFS mount: a
            # host-side edit while sh is reading a script shifts the byte
            # offsets it executes from.
            rm -rf /root/build
            mkdir -p /root/build
            tar -cf - scripts config | tar -xf - -C /root/build
            cp "${PKGLIST}" /root/build/slice.txt
            cd /root/build
            export SLICE_FILE=/root/build/slice.txt
            WS="$(cd "$GITHUB_WORKSPACE" && pwd)"
            sh scripts/vm_build.sh

            # The public key is derived HERE, by pkg itself: for the ecc
            # signers it is a binary DER blob only pkg key can produce, and
            # this is also the exact bytes consumers put in pubkey:.
            pkg key --public -t "${PKG_KEY_TYPE}" "$WS/work/repo.key" > "$WS/work/repo.pub"
            test -s "$WS/work/repo.pub"
            echo "repo.pub: $(wc -c < "$WS/work/repo.pub") bytes, sha256 $(sha256 -q "$WS/work/repo.pub")"
            PYTHONPATH=scripts python3 scripts/mkshards.py \
              --result   /root/build/out/result.json \
              --packages "${PKGDATA}/packages/${POUDRIERE_JAIL}-default/.latest/All" \
              --packages "${PKGDATA}/packages/${POUDRIERE_JAIL}-default/.building/All" \
              --ledger   "$WS/work/ledger.json" \
              --existing "$WS/work/existing" \
              --key      "$WS/work/repo.key" \
              --key-type "${PKG_KEY_TYPE}" \
              --pubkey   "$WS/work/repo.pub" \
              --repo     "${REPO}" \
              --abi      "${TARGET_ABI}" \
              --abi-slug "${ABI_SLUG}" \
              --origins  config/pkglist \
              --ports-commit "$(cat /root/build/out/ports_commit)" \
              --now      "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --out      "$WS/out"
            cp /root/build/out/result.json /root/build/out/build_seconds "$WS/out/" 2>/dev/null || true
            # logs of failed ports, for diagnosis after the runner is gone
            if [ -d /root/build/out/faillogs ]; then
              mkdir -p "$WS/out/faillogs"
              cp /root/build/out/faillogs/* "$WS/out/faillogs/" 2>/dev/null || true
            fi
            ls -la "$WS/out" "$WS/out/shards" "$WS/out/faillogs" 2>/dev/null || true

      - name: Show what came back
        if: always()
        run: |
          set -eux
          echo "prepared-image cache hit: ${{ steps.vm.outputs.cache-after-prepare-hit }}"
          ls -la out || true
          ls -la out/shards/* || true
          cat out/result.json || true
          cat out/upload.json || true
          cat out/anyvm.conf || true

      - name: Publish shard releases and refresh the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          PYTHONPATH=scripts python3 scripts/publish.py \
            --repo "${{ github.repository }}" \
            --abi-slug "${{ inputs.abi_slug }}" \
            publish --upload-json out/upload.json --out out --pubkey work/repo.pub

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-results-${{ inputs.abi_slug }}
          path: |
            out/result.json
            out/ledger.json
            out/anyvm.conf
            out/upload.json
            out/faillogs/
          if-no-files-found: warn
